name: GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify release tag and protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check tag / version agreement
        env:
          TAG: ${{ github.ref_name }}
        run: test "$TAG" = "v$(cat VERSION)"
      - name: JavaScript tests
        run: |
          node --check ui/app.js
          node --check ui/theme.js
          node --check ui/codec.js
          node tests/test-codec.js
      - name: Native PowerShell tests (simulated transport)
        shell: pwsh
        run: pwsh -NoProfile -File ./Start-AMAG23.ps1 -SelfTest

  interface:
    name: Verify graphical workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - run: python tests/test-ui.py

  publish:
    name: Package and publish release
    needs: [verify, interface]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build versioned ZIP with complete credits
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/package_release.py --version "$TAG"
      - name: Publish verified ZIP and checksum file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/AMAG23-Classic-"$TAG".zip dist/SHA256SUMS.txt \
            --title "AMAG23 Classic $TAG" --generate-notes --verify-tag
