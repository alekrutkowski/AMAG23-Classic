name: Test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-native:
    name: JavaScript + PowerShell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check JS syntax
        shell: pwsh
        run: |
          node --check ui/app.js
          node --check ui/theme.js
          node --check ui/codec.js
      - name: Verify macro codec
        run: node tests/test-codec.js
      - name: Test PowerShell native protocol (simulated transport)
        shell: pwsh
        run: pwsh -NoProfile -File ./Start-AMAG23.ps1 -SelfTest

  interface:
    name: Chromium graphical tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install test-only browser dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run graphical tests (simulated USB backend)
        run: python tests/test-ui.py
      - name: Validate release packaging
        run: |
          python scripts/package_release.py
          python -m zipfile -t dist/AMAG23-Classic-v$(cat VERSION).zip
